[project]
name = "audiarr"
version = "0.1.0"
description = "Servarr-style audiobook manager scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.5",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.31",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
