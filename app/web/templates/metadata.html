{% extends "base.html" %}

{% block content %}
  <h1>{{ t.metadata_title }}</h1>
  <p class="muted">{{ t.metadata_subtitle }}</p>

  <div class="card">
    <form id="metadata-search-form" class="inline-form">
      <label>{{ t.metadata_query_label }}
        <input type="text" id="ms-query" required>
      </label>
      <label>{{ t.metadata_locale_label }}
        <select id="ms-locale">
          <option value="us">us</option>
          <option value="de">de</option>
        </select>
      </label>
      <label>{{ t.metadata_limit_label }}
        <input type="number" id="ms-limit" value="10" min="1" max="50">
      </label>
      <button type="submit">{{ t.metadata_search_button }}</button>
    </form>
  </div>

  <div id="metadata-results" class="card">
    <p class="muted">{{ t.metadata_results_hint }}</p>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/js/metadata.js"></script>
{% endblock %}
