{% extends "settings/shell.html" %}

{% block settings_content %}
  <section class="card settings-form">
    <div class="section-head">
      <span class="eyebrow">{{ t.settings_eyebrow }}</span>
      <h2>{{ t.settings_section_quality }}</h2>
    </div>
    <p class="section-hint">{{ t.settings_quality_hint }}</p>
    <div id="quality-definitions"></div>
    <div class="button-row">
      <button type="button" id="quality-add-btn" class="btn btn-secondary">{{ t.settings_quality_add }}</button>
    </div>
  </section>
{% endblock %}
