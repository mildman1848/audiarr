{% extends "settings/shell.html" %}

{% block settings_content %}
  <section class="card settings-form">
    <div class="section-head">
      <span class="eyebrow">{{ t.settings_eyebrow }}</span>
      <h2>{{ t.settings_section_indexers }}</h2>
    </div>
    <h3>{{ t.settings_idx_prowlarr_heading }}</h3>
    <label class="inline-check">
      <input type="checkbox" id="prowlarr-enabled">
      {{ t.settings_enabled_label }}
    </label>
    <label>{{ t.settings_field_name }}
      <input type="text" id="prowlarr-name" autocomplete="off">
    </label>
    <label>{{ t.settings_base_url_label }}
      <input type="text" id="prowlarr-url" autocomplete="off" placeholder="http://prowlarr:9696">
    </label>
    <label>{{ t.settings_api_key_label }}
      <input type="password" id="prowlarr-api-key" autocomplete="new-password">
    </label>
    <p class="muted small">{{ t.settings_api_key_hint }}</p>
    <div class="button-row">
      <button type="button" id="prowlarr-test-btn" class="btn btn-secondary">{{ t.settings_test }}</button>
      <span id="prowlarr-msg" class="muted" role="status"></span>
    </div>
  </section>
{% endblock %}
