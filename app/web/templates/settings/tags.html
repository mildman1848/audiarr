{% extends "settings/shell.html" %}

{% block settings_content %}
  <section class="card settings-form placeholder-card">
    <div class="section-head">
      <span class="eyebrow">{{ t.settings_eyebrow }}</span>
      <h2>{{ t.settings_section_tags }}</h2>
    </div>
    <p class="section-hint">{{ t.settings_tags_hint }}</p>
    <p class="muted">{{ t.settings_tags_empty }}</p>
    <p class="callout">{{ t.settings_tags_next_note }}</p>
  </section>
{% endblock %}
