{% extends "settings/shell.html" %}

{% block settings_content %}
  <section class="card settings-form">
    <div class="section-head">
      <span class="eyebrow">{{ t.settings_eyebrow }}</span>
      <h2>{{ t.settings_section_connect }}</h2>
    </div>
    <p class="section-hint">{{ t.settings_connect_hint }}</p>

    <div id="connect-list"></div>

    <div class="button-row">
      <button type="button" id="connect-add-btn" class="btn btn-primary">{{ t.settings_connect_add }}</button>
    </div>
  </section>
{% endblock %}

{% block scripts %}
  <script src="/static/js/settings.js?v={{ version }}-connect"></script>
  <script src="/static/js/connect.js?v={{ version }}-connect"></script>
{% endblock %}
