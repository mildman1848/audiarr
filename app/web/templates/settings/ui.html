{% extends "settings/shell.html" %}

{% block settings_content %}
  <section class="card settings-form">
    <div class="section-head">
      <span class="eyebrow">{{ t.settings_eyebrow }}</span>
      <h2>{{ t.settings_section_ui }}</h2>
    </div>
    <div class="settings-subsection">
      <label>{{ t.settings_ui_language }}
        <select id="ui-language">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
      <p class="muted small">{{ t.settings_ui_language_hint }}</p>
    </div>

    <div class="settings-subsection">
      <label>{{ t.settings_ui_theme_label }}
        <select id="ui-theme">
          <option value="dark">{{ t.settings_ui_theme_dark }}</option>
          <option value="light">{{ t.settings_ui_theme_light }}</option>
        </select>
      </label>
      <label>{{ t.settings_ui_date_format_label }}
        <select id="ui-date-format">
          <option value="YYYY-MM-DD">YYYY-MM-DD</option>
          <option value="DD.MM.YYYY">DD.MM.YYYY</option>
          <option value="MM/DD/YYYY">MM/DD/YYYY</option>
        </select>
      </label>
      <p class="muted small">{{ t.settings_ui_date_format_hint }}</p>
    </div>
  </section>
{% endblock %}
