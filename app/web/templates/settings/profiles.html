{% extends "settings/shell.html" %}

{% block settings_content %}
  <section class="card settings-form">
    <div class="section-head">
      <span class="eyebrow">{{ t.settings_eyebrow }}</span>
      <h2>{{ t.settings_section_profiles }}</h2>
    </div>
    <p class="section-hint">{{ t.settings_profiles_hint }}</p>
    <div id="profile-summary"></div>
    <p class="callout">{{ t.settings_profiles_next_note }}</p>
  </section>
{% endblock %}
