name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push image to configured registries
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: audiarr
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITLAB_REGISTRY_IMAGE: ${{ secrets.GITLAB_REGISTRY_IMAGE }}
      GITLAB_REGISTRY_USER: ${{ secrets.GITLAB_REGISTRY_USER }}
      GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      CODEBERG_REGISTRY_IMAGE: ${{ secrets.CODEBERG_REGISTRY_IMAGE }}
      CODEBERG_REGISTRY_USER: ${{ secrets.CODEBERG_REGISTRY_USER }}
      CODEBERG_REGISTRY_TOKEN: ${{ secrets.CODEBERG_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version from Dockerfile
        id: ver
        shell: bash
        run: |
          # Single source of truth: the ARG defaults in the Dockerfile.
          # Bumping the revision there is enough for CI to tag correctly.
          VERSION="$(sed -n 's/^ARG VERSION=//p' Dockerfile | tail -1 | tr -d '"')"
          APP_VERSION="${VERSION%%-*}"
          IMAGE_REVISION="${VERSION#*-}"
          if [[ -z "$VERSION" || "$VERSION" == "$APP_VERSION" || -z "$IMAGE_REVISION" ]]; then
            echo "Could not parse VERSION=$VERSION from Dockerfile" >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "app_version=${APP_VERSION}"
            echo "image_revision=${IMAGE_REVISION}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image targets
        id: images
        shell: bash
        run: |
          {
            echo 'images<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
            if [[ -n "${DOCKERHUB_USERNAME}" ]]; then echo "docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"; fi
            if [[ -n "${GITLAB_REGISTRY_IMAGE}" ]]; then echo "${GITLAB_REGISTRY_IMAGE}"; fi
            if [[ -n "${CODEBERG_REGISTRY_IMAGE}" ]]; then echo "${CODEBERG_REGISTRY_IMAGE}"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)) && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Login to GitLab Registry
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)) && env.GITLAB_REGISTRY_IMAGE != '' && env.GITLAB_REGISTRY_USER != '' && env.GITLAB_REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ env.GITLAB_REGISTRY_USER }}
          password: ${{ env.GITLAB_REGISTRY_TOKEN }}
      - name: Login to Codeberg Registry
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)) && env.CODEBERG_REGISTRY_IMAGE != '' && env.CODEBERG_REGISTRY_USER != '' && env.CODEBERG_REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ env.CODEBERG_REGISTRY_USER }}
          password: ${{ env.CODEBERG_REGISTRY_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{ is_default_branch }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            APP_VERSION=${{ steps.ver.outputs.app_version }}
            IMAGE_REVISION=${{ steps.ver.outputs.image_revision }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
